nt-weight:bold;text-align:center;margin:12px 0}.muted{color:#58708c;font-size:13px}footer{text-align:center;color:white;font-size:12px;margin:22px 0}.privacy{font-weight:bold;color:#144b7b}body::before{content:"";position:fixed;inset:0;background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgNDIwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjQyMCIgZmlsbD0id2hpdGUiLz48cGF0aCBmaWxsPSIjMDAzOGI4IiBkPSJNMCA0OGg2MDB2NDZIMHpNMCAzMjZoNjAwdjQ2SDB6Ii8+PGcgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMDAzOGI4IiBzdHJva2Utd2lkdGg9IjE0Ij48cGF0aCBkPSJNMzAwIDEyMiAzNzAgMjQySDIzMHoiLz48cGF0aCBkPSJNMzAwIDI3NCAyMzAgMTU0aDE0MHoiLz48L2c+PC9zdmc+");background-size:100% 100%;background-position:center;background-repeat:no-repeat;opacity:.22;pointer-events:none;z-index:0}.wrap{position:relative;z-index:1}.card{background:rgba(255,255,255,.94)}footer{font-size:clamp(20px,5.3vw,27px);font-weight:800;line-height:1.45;padding:16px 12px;border-radius:14px;background:linear-gradient(125deg,rgba(2,57,151,.94),rgba(20,117,229,.90));text-wrap:balance}
/* Responsive layout for phones, tablets, desktops and landscape screens */
html{width:100%;min-width:0;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{width:100%;min-width:0;overflow-x:hidden;min-height:100vh;min-height:100dvh}
.wrap{width:min(100%,760px);max-width:none;padding:clamp(10px,2.3vw,24px);margin-inline:auto}
.card{width:100%;min-width:0;padding:clamp(14px,3vw,28px);border-radius:clamp(15px,3vw,24px)}
.flag{font-size:clamp(28px,5vh,46px)}
h1{font-size:clamp(25px,4.3vw,42px);overflow-wrap:anywhere}
.intro{font-size:clamp(15px,2.3vw,19px);margin-bottom:clamp(10px,2vh,20px)}
.counter{margin:clamp(10px,2vh,18px) 0;padding:clamp(12px,2vh,22px)}
.counter strong{font-size:clamp(36px,7vh,65px)}
input{max-width:100%;min-width:0;font-size:16px}
button{max-width:100%;touch-action:manipulation}

@media(max-width:420px){.wrap{padding:10px}.card{padding:16px 14px}.badge{font-size:12px;margin:7px 0}.intro{line-height:1.45}label{margin-top:10px}input{padding:11px 12px}.check{margin:12px 0}button{padding:13px 10px;font-size:18px}.share{margin-top:9px}footer{padding:12px}}
@media(max-height:740px){.wrap{padding-block:8px}.card{padding-block:12px}.flag{font-size:28px}h1{margin:4px 0 8px}.badge{margin:5px 0}.intro{margin-bottom:8px}.counter{margin:8px 0;padding:10px}.counter strong{font-size:36px}label{margin:8px 0 4px}input{padding:9px 12px}.check{margin:9px 0}button{padding:11px}.status{margin:7px 0}footer{margin:9px 0;padding:10px}}

</style></head><body><main class="wrap"><section class="card"><div class="flag">🇮🇱</div><div class="badge">חתימה מאובטחת · חתימה אחת לכל תעודת זהות</div><h1>עצומה לממשלת אחדות</h1><p class="intro">מצטרפים לקריאה ציבורית להקמת ממשלת אחדות. יחד נשמיע קול אזרחי.</p><div class="counter"><small>מספר חתימות מאומתות</small><strong id="count">—</strong><small>הספירה תוצג לאחר חיבור שירות ספירה מאובטח</small></div><form class="form" id="form"><label for="name">שם מלא</label><input id="name" autocomplete="name" placeholder="השם שלך" required minlength="2"><label for="id">מספר תעודת זהות</label><input id="id" inputmode="numeric" autocomplete="off" minlength="9" maxlength="9" placeholder="9 ספרות" required pattern="[0-9]{9}" title="יש להזין בדיוק 9 ספרות"><label class="check"><input type="checkbox" id="agree" required><span>אני מאשר/ת את הצטרפותי לעצומה ואת השימוש בפרטים לצורך רישום חתימה אחת ומניעת כפילויות.</span></label><button class="sign" type="submit">✍️ אני חותם/ת</button></form><div class="status" id="status" role="status" aria-live="polite"></div><button class="share" id="share">📲 שיתוף בוואטסאפ</button></section><footer>הפרטים מועברים בחיבור מוצפן ולא יפורסמו לציבור. לאישור הממצאים יילקח רואה חשבון.</footer></main><script>
const $ = x => document.getElementById(x);
const ENDPOINT = 'https://gdjqhrokbwiofldwgocj.supabase.co/functions/v1/submit-signature';
const form = $('form'), status = $('status'), submit = form.querySelector('button[type="submit"]');
function validIsraeliId(value) {
  if (!/^\d{9}$/.test(value)) return false;
  return [...value].reduce((sum, digit, index) => {
    let n = Number(digit) * (index % 2 === 0 ? 1 : 2);
    return sum + (n > 9 ? n - 9 : n);
  }, 0) % 10 === 0;
}
$('id').addEventListener('input', e => {
  const input = e.target;
  input.value = input.value.replace(/[^0-9]/g, '').slice(0, 9);
  input.setCustomValidity(input.value.length === 9 && !validIsraeliId(input.value) ? 'מספר תעודת זהות אינו תקין' : '');
});
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!form.reportValidity()) return;
  const full_name = $('name').value.trim();
  const identity_number = $('id').value.trim();
  if (full_name.length < 2 || !validIsraeliId(identity_number)) {
    status.textContent = 'נא להזין שם מלא ומספר תעודת זהות תקין';
    return;
  }
  submit.disabled = true;
  status.textContent = 'שולח חתימה באופן מאובטח…';
  try {
    const response = await fetch(ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({full_name, identity_number})
    });
    const result = await response.json().catch(() => ({}));
    if (response.ok && result.success === true) {
      status.textContent = '✓ החתימה נשמרה בהצלחה. תודה על הצטרפותך!';
      form.reset();
    } else if (response.status === 409 || result.error === 'Already signed') {
      status.textContent = 'תעודת הזהות הזאת כבר חתמה על העצומה.';
    } else if (response.status === 400) {
      status.textContent = 'פרטי החתימה אינם תקינים. נא לבדוק ולנסות שוב.';
    } else {
      status.textContent = 'לא ניתן לשמור כרגע את החתימה. נסו שוב מאוחר יותר.';
    }
  } catch (_) {
    status.textContent = 'שגיאת תקשורת. בדקו את החיבור ונסו שוב.';
  } finally {
    submit.disabled = false;
  }
});
$('share').addEventListener('click', () => {
  const msg = '🇮🇱 עצומה לממשלת אחדות\n' + location.href;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank', 'noopener');
});
</script></body></html>
